<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>STICKIFY 21 | إذن تجهيز وفحص الطلب</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Readex+Pro:wght@400;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/jpeg" href="logo.jpg">
  
  <!-- Compiled CSS (Tailwind CLI) -->
  <link rel="stylesheet" href="dist/styles.css">

  <style>
    body {
      font-family: 'Readex Pro', 'Plus Jakarta Sans', sans-serif;
      background-color: #F8F8FA;
      color: #0E0E10;
      -webkit-font-smoothing: antialiased;
    }
    
    .item-card.checked {
      border-color: #10B981 !important;
      background-color: #F0FDF4 !important;
    }
    .item-card.checked .check-indicator {
      background-color: #10B981 !important;
      color: white !important;
    }

    /* Print First CSS (R13) */
    @page {
      size: A4 portrait;
      margin: 8mm;
    }
    @media print {
      .no-print {
        display: none !important;
      }
      body {
        background-color: white !important;
        padding: 0 !important;
        margin: 0 !important;
      }
      .page-slip {
        page-break-inside: avoid;
        break-inside: avoid;
        page-break-after: always;
        break-after: page;
        max-height: 275mm;
        overflow: hidden;
      }
      .page-slip-a5 {
        max-height: 195mm;
      }
      .shipping-label-card {
        max-width: 100mm;
        max-height: 150mm;
      }
    }

    /* Compaction Rules (Strictly 1-page A4) */
    .compact-mode .slip-header { padding-bottom: 8px; margin-bottom: 8px; }
    .compact-mode .slip-customer-grid { padding: 8px 0; }
    .compact-mode .slip-thumb { width: 32px; height: 32px; }
    .compact-mode .slip-text-main { font-size: 11px; }

    .ultra-compact-mode .slip-header { padding-bottom: 4px; margin-bottom: 6px; }
    .ultra-compact-mode .slip-customer-grid { padding: 6px 0; font-size: 10px; }
    .ultra-compact-mode .slip-thumb { width: 22px; height: 22px; }
    .ultra-compact-mode .slip-text-main { font-size: 9.5px; }
    .ultra-compact-mode .slip-items-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  </style>
</head>
<body class="p-4 sm:p-6 min-h-screen">

  <!-- Admin Auth Lock Screen (R11: Shared localStorage Session) -->
  <div id="admin-lock-screen" class="fixed inset-0 z-50 bg-[#0E0E10]/95 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center space-y-4 shadow-2xl">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-orange-50 border border-orange-200 flex items-center justify-center text-2xl">
        🔒
      </div>
      <div>
        <h3 class="font-extrabold text-base text-zinc-900">إذن تجهيز الطلبيات محمي</h3>
        <p class="text-xs text-zinc-500 mt-1">يجب تسجيل الدخول كمسؤول متجر لعرض هذا الإذن</p>
      </div>
      <a href="admin.html" class="block w-full py-3 rounded-2xl bg-[#FF5000] hover:bg-[#E04600] text-white font-bold text-xs transition shadow-sm">
        تسجيل الدخول في لوحة الإدارة ←
      </a>
    </div>
  </div>

  <div class="max-w-4xl mx-auto space-y-4">
    
    <!-- Top Bar / Action Buttons -->
    <div class="no-print flex items-center justify-between gap-4 bg-white p-3.5 rounded-2xl border border-zinc-200 shadow-sm flex-wrap">
      <div class="flex items-center gap-2">
        <a href="admin.html" class="px-3 py-1.5 rounded-xl bg-zinc-900 hover:bg-black text-white text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
          <span>← لوحة الإدارة</span>
        </a>
        <a href="index.html" class="px-3 py-1.5 rounded-xl bg-zinc-100 hover:bg-zinc-200 text-zinc-700 text-xs font-bold transition">
          المتجر
        </a>
        <span class="text-xs text-zinc-300 hidden sm:inline">|</span>
        <span class="text-xs font-bold text-zinc-500 hidden sm:inline">إذن تجهيز الطلبية وفحص الجودة</span>
      </div>

      <!-- View Modes & Print (R13) -->
      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="setSlipViewMode('a4')" data-mode="a4" class="mode-btn px-3 py-1.5 rounded-xl bg-zinc-900 text-white text-xs font-bold transition">
          A4 صفحة واحدة
        </button>
        <button onclick="setSlipViewMode('a5')" data-mode="a5" class="mode-btn px-3 py-1.5 rounded-xl bg-zinc-100 hover:bg-zinc-200 text-zinc-700 text-xs font-bold transition">
          A5 نصف صفحة
        </button>
        <button onclick="setSlipViewMode('label')" data-mode="label" class="mode-btn px-3 py-1.5 rounded-xl bg-zinc-100 hover:bg-zinc-200 text-zinc-700 text-xs font-bold transition">
          🏷️ بوليصة شحن
        </button>
        <button onclick="window.print()" class="px-4 py-1.5 rounded-xl bg-[#FF5000] hover:bg-[#E04600] text-white text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
          <span>🖨️ طباعة / حفظ PDF</span>
        </button>
      </div>
    </div>

    <!-- Slips Container -->
    <div id="slips-container" class="space-y-6">
      <!-- Injected via JavaScript -->
    </div>

  </div>

  <script type="module">
    import { escapeHtml, sanitizeSvg, sanitizeUrl } from './src/utils/escape.js';
    import { CONFIG } from './src/config/config.js';
    import { isAdminAuthenticated, setupAuthSync } from './src/domain/auth.js';
    import { normalizeOrderLines } from './src/domain/orders.js';

    let currentViewMode = 'a4'; // 'a4' | 'a5' | 'label'
    let checkedItems = new Set();
    let totalItemsCount = 0;

    function checkAuth() {
      const isAuth = isAdminAuthenticated();
      const lockOverlay = document.getElementById('admin-lock-screen');
      if (!isAuth) {
        if (lockOverlay) lockOverlay.classList.remove('hidden');
      } else {
        if (lockOverlay) lockOverlay.classList.add('hidden');
      }
      return isAuth;
    }

    setupAuthSync(() => {
      checkAuth();
    });

    export function setSlipViewMode(mode) {
      currentViewMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => {
        const isTarget = btn.dataset.mode === mode;
        btn.classList.toggle('bg-zinc-900', isTarget);
        btn.classList.toggle('text-white', isTarget);
        btn.classList.toggle('bg-zinc-100', !isTarget);
        btn.classList.toggle('text-zinc-700', !isTarget);
      });
      initSlip();
    }

    function initSlip() {
      checkAuth();

      const urlParams = new URLSearchParams(window.location.search);
      const dataParam = urlParams.get('o') || urlParams.get('data');
      const idParam = urlParams.get('id');
      const idsParam = urlParams.get('ids');

      let storedOrders = [];
      try {
        storedOrders = JSON.parse(localStorage.getItem('stickify21_orders') || '[]');
      } catch(e) {}

      let storedProds = [];
      try {
        storedProds = JSON.parse(localStorage.getItem('stickify21_products') || '[]');
      } catch(e) {}
      const prodMap = {};
      storedProds.forEach(p => { prodMap[p.sku] = p; });

      // Handle batch slips if ?ids= is provided with multiple IDs
      if (idsParam) {
        const idList = idsParam.split(',').map(s => s.trim()).filter(Boolean);
        const matchedOrders = idList.map(id => storedOrders.find(o => o.id === id)).filter(Boolean);
        if (matchedOrders.length > 0) {
          renderOrdersSlips(matchedOrders, prodMap);
          return;
        }
      }

      let order = null;

      // 1. Try from ?o= base64
      if (dataParam) {
        try {
          const jsonStr = decodeURIComponent(atob(dataParam));
          order = JSON.parse(jsonStr);
        } catch (e) {
          console.error("Error decoding order param", e);
        }
      }

      // 2. Try from localStorage ?id=
      if (!order && idParam) {
        order = storedOrders.find(o => o.id === idParam);
      }

      // Fallback sample if no order found
      if (!order) {
        if (storedOrders.length > 0) {
          order = storedOrders[0];
        } else {
          order = {
            id: 'S21-' + Math.floor(1000 + Math.random() * 9000),
            date: new Date().toLocaleDateString('ar-EG'),
            customer: {
              name: 'معاينة تجريبية للطلب',
              phone: '01043546503',
              city: 'القاهرة',
              address: 'مدينة نصر - شارع عباس العقاد',
              notes: 'طلب تجريبي لمعاينة شاشة التجهيز'
            },
            payment: 'عند الاستلام (COD)',
            total: 125,
            lines: [
              { sku: 'DEV-01', name: 'جيت بوش بالقوة', size: '8 سم', quantity: 2, unitPrice: 35, total: 70 },
              { sku: 'BM-01', name: 'فاصل كتب: خير جليس', size: 'بوك مارك', quantity: 1, unitPrice: 25, total: 25 },
              { sku: 'S21-01', name: 'شعار STICKIFY 21 الرسمي', size: '8 سم', quantity: 1, unitPrice: 30, total: 30 }
            ]
          };
        }
      }

      renderOrdersSlips([order], prodMap);
    }

    function renderOrdersSlips(orders, prodMap) {
      const container = document.getElementById('slips-container');
      if (!container) return;

      if (currentViewMode === 'label') {
        renderShippingLabels(orders, container);
        return;
      }

      container.innerHTML = orders.map((order, orderIdx) => {
        const lines = normalizeOrderLines(order);
        
        // Count total item units for auto-compaction
        let totalCount = 0;
        lines.forEach(l => {
          if (l.type === 'pack') totalCount += (l.items?.length || 5);
          else totalCount += (l.quantity || 1);
        });

        // Determine compaction mode (R13: strict single page)
        let compactionClass = '';
        if (totalCount > 14) {
          compactionClass = 'ultra-compact-mode';
        } else if (totalCount > 6) {
          compactionClass = 'compact-mode';
        }

        const isA5 = currentViewMode === 'a5';
        const rawPhone = (order.customer?.phone || '').replace(/[^0-9]/g, '');

        // Render lines (packs grouped with sub-items per R1)
        const linesHtml = lines.map((line, lineIdx) => {
          if (line.type === 'pack') {
            const subItemsHtml = (line.items || []).map((sub, sIdx) => {
              const prod = prodMap[sub.sku] || {};
              const safeImg = sanitizeUrl(sub.image || prod.image || (sub.sku === 'S21-01' ? 'logo.jpg' : null));
              const safeSvg = prod.svg ? sanitizeSvg(prod.svg) : `<div class="font-mono font-bold text-[10px] text-zinc-500">#${escapeHtml(sub.sku)}</div>`;

              return `
                <div class="flex items-center justify-between p-1.5 rounded-lg bg-white border border-zinc-200 text-xs gap-2">
                  <div class="flex items-center gap-2 min-w-0">
                    <div class="slip-thumb w-8 h-8 rounded bg-zinc-50 border border-zinc-100 flex items-center justify-center p-0.5 flex-shrink-0 overflow-hidden">
                      ${safeImg ? `<img src="${safeImg}" class="w-full h-full object-contain">` : safeSvg}
                    </div>
                    <div class="min-w-0">
                      <span class="font-mono font-bold text-[10px] text-zinc-900 block truncate">#${escapeHtml(sub.sku || 'S21')} - ${escapeHtml(sub.name || '')}</span>
                      <span class="text-[9.5px] text-zinc-400 font-mono">${escapeHtml(sub.sizeKey || '8 سم')} (${escapeHtml(sub.finish || 'مطفي')})</span>
                    </div>
                  </div>
                  <span class="text-[10px] font-bold text-emerald-600 flex-shrink-0">ضمن الباقة</span>
                </div>
              `;
            }).join('');

            return `
              <div class="slip-pack-group col-span-full p-2.5 rounded-2xl bg-orange-50/50 border border-[#FF5000]/30 space-y-2" data-pack-group>
                <div class="flex items-center justify-between border-b border-orange-200/60 pb-1.5 font-bold text-xs">
                  <span class="text-[#FF5000] flex items-center gap-1.5">
                    <span>🎁</span>
                    <span>باقة ${line.size} استيكرات (${Math.round((line.discountRate || 0.2) * 100)}% خصم)</span>
                  </span>
                  <span class="font-mono text-zinc-900">${line.packPrice} ${CONFIG.CURRENCY}</span>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-1.5">
                  ${subItemsHtml}
                </div>
              </div>
            `;
          }

          // Single item
          const prod = prodMap[line.sku] || {};
          const isBookmark = line.type === 'bookmark' || (line.sku && line.sku.startsWith('BM-'));
          const safeImg = sanitizeUrl(line.image || prod.image || (line.sku === 'S21-01' ? 'logo.jpg' : null));
          const safeSvg = prod.svg ? sanitizeSvg(prod.svg) : `<div class="font-mono font-bold text-xs text-zinc-500">#${escapeHtml(line.sku || 'S21')}</div>`;

          return `
            <div class="item-card p-2.5 rounded-xl bg-zinc-50 border border-zinc-200 flex items-center justify-between gap-3 text-xs">
              <div class="flex items-center gap-2.5 min-w-0">
                <div class="slip-thumb w-10 h-10 rounded-lg bg-white border border-zinc-200 p-1 flex items-center justify-center overflow-hidden flex-shrink-0">
                  ${safeImg ? `<img src="${safeImg}" class="w-full h-full object-contain">` : safeSvg}
                </div>
                <div class="min-w-0">
                  <h4 class="font-bold text-zinc-900 truncate slip-text-main">${escapeHtml(line.name || 'منتج')}</h4>
                  <div class="text-[10px] text-zinc-500 font-mono flex items-center gap-2">
                    <span class="font-bold text-zinc-800">#${escapeHtml(line.sku || 'S21')}</span>
                    <span>•</span>
                    <span>${escapeHtml(isBookmark ? 'بوك مارك' : (line.size || '8 سم'))}</span>
                  </div>
                </div>
              </div>
              <div class="text-left font-mono text-xs flex-shrink-0">
                <span class="font-bold text-zinc-900">${line.total || ((line.unitPrice || 35) * (line.quantity || 1))} ${CONFIG.CURRENCY}</span>
                <span class="block text-[10px] text-zinc-400">(${line.quantity || 1} × ${line.unitPrice || 35})</span>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div id="packing-slip-card" class="page-slip packing-slip-sheet ${isA5 ? 'page-slip-a5' : ''} ${compactionClass} bg-white rounded-3xl border border-zinc-200 p-5 sm:p-7 shadow-sm text-xs">
            
            <!-- Slip Header -->
            <div class="slip-header flex items-center justify-between border-b border-zinc-200 pb-4 mb-4">
              <div class="flex items-center gap-3">
                <img src="logo.jpg" alt="STICKIFY21" class="h-9 w-auto object-contain">
                <div>
                  <h2 class="font-extrabold text-base text-zinc-900">إذن تجهيز طلبية <span id="order-id">#${escapeHtml(order.id)}</span></h2>
                  <p class="text-[10px] text-zinc-400 font-mono">STICKIFY 21 PACKING & QC SLIP</p>
                </div>
              </div>
              <div class="text-left font-mono text-xs text-zinc-500">
                <div>${escapeHtml(new Date(order.date || Date.now()).toLocaleDateString('ar-EG'))}</div>
                <div class="text-[#FF5000] font-bold font-sans mt-0.5">جاهز للتجميع والتغليف 📦</div>
              </div>
            </div>

            <!-- Customer & Delivery 2-Column Block -->
            <div class="slip-customer-grid grid grid-cols-2 sm:grid-cols-4 gap-2.5 py-3 border-b border-zinc-200 mb-4 bg-zinc-50/70 p-3 rounded-2xl">
              <div>
                <span class="text-zinc-400 block text-[9.5px] font-bold">اسم العميل:</span>
                <strong id="customer-name" class="text-zinc-900 text-xs">${escapeHtml(order.customer?.name || '')}</strong>
              </div>
              <div>
                <span class="text-zinc-400 block text-[9.5px] font-bold">رقم الهاتف:</span>
                <a id="customer-phone-link" href="https://wa.me/2${rawPhone}" target="_blank" class="font-mono font-bold text-[#FF5000] text-xs hover:underline" dir="ltr">${escapeHtml(order.customer?.phone || '')}</a>
              </div>
              <div>
                <span class="text-zinc-400 block text-[9.5px] font-bold">المحافظة والعنوان:</span>
                <span id="customer-address" class="text-zinc-800 truncate block text-xs">${escapeHtml(order.customer?.governorate || order.customer?.city || '')} - ${escapeHtml(order.customer?.address || '')}</span>
              </div>
              <div>
                <span class="text-zinc-400 block text-[9.5px] font-bold">طريقة الدفع والإجمالي:</span>
                <span id="payment-and-total" class="font-mono font-bold text-zinc-900 text-xs">${escapeHtml(order.payment || 'عند الاستلام')} | ${order.total} ${CONFIG.CURRENCY}</span>
              </div>
            </div>

            <!-- Warning for large orders -->
            ${totalCount > 35 ? `<div class="p-2 bg-amber-50 text-amber-800 text-[10px] rounded-lg border border-amber-200 font-bold mb-2">⚠️ تنبيه: الطلب كبير جداً (${totalCount} قطع) - تم تفعيل الضغط الأقصى للورقة الواحدة.</div>` : ''}

            <!-- Items Section -->
            <div class="space-y-2 mb-4">
              <div class="flex items-center justify-between">
                <h3 class="font-bold text-xs text-zinc-900">محتويات الشحنة (${lines.length} بنود):</h3>
                <span class="text-[10px] text-zinc-400 font-mono">فحص البنود ومطابقتها</span>
              </div>
              <div id="items-grid" class="slip-items-grid grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-[140mm] overflow-hidden">
                ${linesHtml}
              </div>
            </div>

            <!-- Notes if any -->
            ${order.customer?.notes ? `
              <div id="customer-notes" class="p-2 rounded-xl bg-amber-50/50 border border-amber-200 text-[10px] text-amber-900 mb-3">
                <strong>ملاحظات العميل:</strong> ${escapeHtml(order.customer.notes)}
              </div>
            ` : ''}

            <!-- Totals & Quality Check Line -->
            <div class="pt-3 border-t border-zinc-200 flex items-center justify-between text-xs font-mono flex-wrap gap-2">
              <div class="text-zinc-500 font-sans text-[11px]">
                توقيع مسؤول التغليف والجودة: _______________________
              </div>
              <div class="flex items-center gap-3">
                <span class="font-sans text-zinc-600">المطلوب تحصيله (COD):</span>
                <span class="text-base font-extrabold text-[#FF5000]">${order.total} ${CONFIG.CURRENCY}</span>
              </div>
            </div>

          </div>
        `;
      }).join('');
    }

    function renderShippingLabels(orders, container) {
      container.innerHTML = orders.map(order => {
        const rawPhone = (order.customer?.phone || '').replace(/[^0-9]/g, '');

        return `
          <div class="shipping-label-card max-w-sm mx-auto bg-white border-2 border-black rounded-2xl p-5 text-xs space-y-3 font-mono shadow-sm" data-view="label">
            <div class="flex items-center justify-between border-b-2 border-black pb-3">
              <div>
                <h2 class="font-black text-lg tracking-wider text-black">STICKIFY 21</h2>
                <p class="text-[10px] text-zinc-600 font-sans">بوليصة شحن وتوصيل سريعة</p>
              </div>
              <div class="text-left">
                <span class="font-bold text-sm block">#${escapeHtml(order.id)}</span>
                <span class="text-[10px] text-zinc-500">${escapeHtml(new Date(order.date || Date.now()).toLocaleDateString('ar-EG'))}</span>
              </div>
            </div>

            <div class="space-y-1 text-black font-sans">
              <div class="text-sm font-extrabold">المستلم: ${escapeHtml(order.customer?.name || '')}</div>
              <div class="font-mono font-bold text-[#FF5000]" dir="ltr">هاتف: ${escapeHtml(order.customer?.phone || '')}</div>
              <div class="font-bold">المحافظة: ${escapeHtml(order.customer?.governorate || order.customer?.city || '')}</div>
              <div class="text-xs text-zinc-800">العنوان: ${escapeHtml(order.customer?.address || '')}</div>
            </div>

            <div class="p-3 bg-zinc-100 rounded-xl border border-zinc-300 flex items-center justify-between font-sans">
              <span class="font-bold text-xs">قيمة التحصيل عند الاستلام:</span>
              <span class="font-mono text-base font-black text-black">${order.total} ${CONFIG.CURRENCY}</span>
            </div>

            <!-- Simulated Barcode / QR Block -->
            <div class="pt-2 border-t border-zinc-200 text-center">
              <div class="h-8 bg-zinc-900 mx-auto rounded flex items-center justify-center text-white text-[9px] font-mono tracking-widest">
                ||| | |||| || ||| |||| | ||| || |||
              </div>
              <span class="text-[9px] text-zinc-400 font-mono mt-1 block">${escapeHtml(order.id)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    window.setSlipViewMode = setSlipViewMode;
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSlip);
    } else {
      initSlip();
    }
  </script>
</body>
</html>
