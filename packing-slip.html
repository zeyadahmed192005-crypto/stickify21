<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>STICKIFY 21 | إذن تجهيز وفحص الطلب</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Readex+Pro:wght@400;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Readex+Pro:wght@400;600;700;800&family=Space+Grotesk:wght@600;700;800&display=swap" rel="stylesheet"></noscript>
  <link rel="icon" type="image/jpeg" href="logo.jpg">

  <!-- Compiled CSS (Tailwind CLI) -->
  <link rel="stylesheet" href="dist/styles.css">
  <style id="dynamic-page-style">
    @page { size: A4 portrait; margin: 10mm; }
  </style>
  <style>
    html, body {
      font-family: 'Readex Pro', 'Plus Jakarta Sans', sans-serif;
      background-color: #F8F8FA;
      color: #0E0E10;
      -webkit-font-smoothing: antialiased;
    }

    /* Enforce >= 8.5pt (11.4px) minimum readable print typography across the slip */
    .packing-slip-sheet,
    .packing-slip-sheet *,
    .shipping-label-card,
    .shipping-label-card * {
      font-size: max(11.4px, 8.55pt);
      line-height: 1.25;
    }
    .packing-slip-sheet .slip-title { font-size: 16px; line-height: 1.2; }
    .packing-slip-sheet .slip-total-big { font-size: 15px; line-height: 1.2; }
    .shipping-label-card .label-brand { font-size: 18px; line-height: 1.15; }
    .shipping-label-card .label-cod { font-size: 16px; line-height: 1.15; }

    /* Base layout & never clip content */
    .packing-slip-sheet {
      background: #FFFFFF;
      border: 1px solid #E4E4E7;
      border-radius: 16px;
      padding: 18px 20px;
      box-sizing: border-box;
    }
    .slip-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1.5px solid #E4E4E7;
      padding-bottom: 10px;
      margin-bottom: 10px;
      gap: 12px;
    }
    .slip-customer-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 8px;
      background: #FAFAFA;
      border: 1px solid #E4E4E7;
      border-radius: 10px;
      padding: 8px 10px;
      margin-bottom: 10px;
    }
    .slip-items-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px;
    }
    .slip-item-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 6px 8px;
      background: #FAFAFA;
      border: 1px solid #E4E4E7;
      border-radius: 8px;
      min-width: 0;
    }
    .slip-thumb {
      width: 34px;
      height: 34px;
      border-radius: 6px;
      background: #FFFFFF;
      border: 1px solid #E4E4E7;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      padding: 2px;
      overflow: hidden;
    }
    .slip-pack-group {
      grid-column: 1 / -1;
      background: #FFF7ED;
      border: 1px solid rgba(255, 80, 0, 0.35);
      border-radius: 10px;
      padding: 8px;
    }
    .slip-pack-subgrid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 4px;
      margin-top: 6px;
    }
    .slip-pack-subitem {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 4px 6px;
      background: #FFFFFF;
      border: 1px solid #E4E4E7;
      border-radius: 6px;
      min-width: 0;
    }
    .slip-footer {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1.5px solid #E4E4E7;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    /* Progressive Measure-and-Compact Levels (P0-2: never clip, always >= 8.5pt) */
    .compact-l1 { padding: 12px 14px; }
    .compact-l1 .slip-header { padding-bottom: 6px; margin-bottom: 6px; }
    .compact-l1 .slip-customer-grid { padding: 6px 8px; margin-bottom: 6px; gap: 6px; }
    .compact-l1 .slip-thumb { width: 24px; height: 24px; }
    .compact-l1 .slip-item-row { padding: 4px 6px; }

    .compact-l2 { padding: 10px 12px; }
    .compact-l2 .slip-header { padding-bottom: 5px; margin-bottom: 5px; }
    .compact-l2 .slip-customer-grid { padding: 5px 8px; margin-bottom: 5px; gap: 4px; }
    .compact-l2 .slip-thumb { display: none !important; }
    .compact-l2 .slip-item-row { padding: 3px 6px; }
    .compact-l2 .slip-pack-group { padding: 5px 6px; }
    .compact-l2 .slip-pack-subitem { padding: 2px 5px; }

    .compact-l3 { padding: 8px 10px; }
    .compact-l3 .slip-header { padding-bottom: 4px; margin-bottom: 4px; }
    .compact-l3 .slip-customer-grid { padding: 4px 6px; margin-bottom: 4px; }
    .compact-l3 .slip-thumb { display: none !important; }
    .compact-l3 .slip-items-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 3px; }
    .compact-l3 .slip-pack-subgrid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 3px; margin-top: 4px; }
    .compact-l3 .slip-pack-subitem .sub-extra,
    .compact-l3 .slip-item-row .item-extra { display: none; }
    .compact-l3 .slip-item-row { padding: 2px 5px; }
    .compact-l3 .slip-footer { margin-top: 6px; padding-top: 5px; }

    .compact-l4 { padding: 6px 8px; }
    .compact-l4 .slip-header { padding-bottom: 3px; margin-bottom: 3px; }
    .compact-l4 .slip-header img { height: 24px; }
    .compact-l4 .slip-customer-grid { padding: 4px 6px; margin-bottom: 4px; gap: 4px; }
    .compact-l4 .slip-thumb { display: none !important; }
    .compact-l4 .slip-items-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 2px 4px; }
    .compact-l4 .slip-pack-group { padding: 4px 6px; }
    .compact-l4 .slip-pack-subgrid { grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 2px 4px; margin-top: 3px; }
    .compact-l4 .slip-pack-subitem { padding: 2px 4px; }
    .compact-l4 .slip-pack-subitem .sub-name,
    .compact-l4 .slip-pack-subitem .sub-extra,
    .compact-l4 .slip-item-row .item-name-long,
    .compact-l4 .slip-item-row .item-extra { display: none; }
    .compact-l4 .slip-item-row { padding: 2px 4px; border-radius: 4px; }
    .compact-l4 .slip-notes-box { padding: 3px 6px; margin-top: 4px; margin-bottom: 4px; }
    .compact-l4 .slip-footer { margin-top: 5px; padding-top: 4px; }

    /* A5 Mode */
    .page-slip-a5 .slip-customer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .page-slip-a5.compact-l4 .slip-items-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .page-slip-a5.compact-l4 .slip-pack-subgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); }

    @media print {
      .no-print { display: none !important; }
      html, body {
        height: auto !important;
        min-height: 0 !important;
        margin: 0 !important;
        padding: 0 !important;
        background: #FFFFFF !important;
      }
      .slip-shell {
        max-width: none !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      #slips-container {
        display: block !important;
        margin: 0 !important;
        padding: 0 !important;
      }
      #slips-container > * {
        margin-top: 0 !important;
        margin-bottom: 0 !important;
      }
      .packing-slip-sheet {
        border: 1px solid #D4D4D8 !important;
        box-shadow: none !important;
        border-radius: 10px !important;
      }
      .packing-slip-sheet.fit-single-page {
        break-inside: avoid;
        page-break-inside: avoid;
      }
      .packing-slip-sheet:not(:last-child),
      .shipping-label-card:not(:last-child) {
        break-after: page;
        page-break-after: always;
      }
      .shipping-label-card {
        width: 100% !important;
        max-width: none !important;
        margin: 0 !important;
        box-shadow: none !important;
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }
  </style>
</head>
<body class="p-4 sm:p-6">

  <!-- Admin Auth Lock Screen (R11: Shared localStorage Session) -->
  <div id="admin-lock-screen" class="no-print fixed inset-0 z-50 bg-[#0E0E10]/95 backdrop-blur-md flex items-center justify-center p-4 hidden">
    <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-sm w-full text-center space-y-4 shadow-2xl">
      <div class="w-14 h-14 mx-auto rounded-2xl bg-orange-50 border border-orange-200 flex items-center justify-center text-zinc-800">
        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" /></svg>
      </div>
      <div>
        <h3 class="font-extrabold text-base text-zinc-900">إذن تجهيز الطلبيات محمي</h3>
        <p class="text-xs text-zinc-500 mt-1">يجب تسجيل الدخول كمسؤول متجر لعرض هذا الإذن</p>
      </div>
      <a href="admin.html" class="block w-full py-3 rounded-2xl bg-[#FF5000] hover:bg-[#E04600] text-white font-bold text-xs transition shadow-sm">
        تسجيل الدخول في لوحة الإدارة
      </a>
    </div>
  </div>

  <div class="slip-shell max-w-4xl mx-auto space-y-4">

    <!-- Top Bar / Action Buttons -->
    <div class="no-print flex items-center justify-between gap-4 bg-white p-3.5 rounded-2xl border border-zinc-200 shadow-sm flex-wrap">
      <div class="flex items-center gap-2">
        <a href="admin.html" class="px-3 py-1.5 rounded-xl bg-zinc-900 hover:bg-black text-white text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
          <span>لوحة الإدارة</span>
        </a>
        <a href="index.html" class="px-3 py-1.5 rounded-xl bg-zinc-100 hover:bg-zinc-200 text-zinc-700 text-xs font-bold transition">
          المتجر
        </a>
        <span class="text-xs font-bold text-zinc-500 hidden sm:inline">إذن تجهيز الطلبية وفحص الجودة</span>
      </div>

      <!-- View Modes & Print (R13) -->
      <div class="flex items-center gap-2 flex-wrap">
        <button onclick="setSlipViewMode('a4')" data-mode="a4" class="mode-btn px-3 py-1.5 rounded-xl bg-zinc-900 text-white text-xs font-bold transition">
          A4 صفحة واحدة
        </button>
        <button onclick="setSlipViewMode('a5')" data-mode="a5" class="mode-btn px-3 py-1.5 rounded-xl bg-zinc-100 hover:bg-zinc-200 text-zinc-700 text-xs font-bold transition">
          A5 نصف صفحة
        </button>
        <button onclick="setSlipViewMode('label')" data-mode="label" class="mode-btn px-3 py-1.5 rounded-xl bg-zinc-100 hover:bg-zinc-200 text-zinc-700 text-xs font-bold transition">
          بوليصة شحن
        </button>
        <button onclick="window.print()" class="px-4 py-1.5 rounded-xl bg-[#FF5000] hover:bg-[#E04600] text-white text-xs font-bold transition flex items-center gap-1.5 shadow-sm">
          <span>طباعة / حفظ PDF</span>
        </button>

    </div>

    <!-- Slips Container -->
    <div id="slips-container" class="space-y-6">
      <!-- Injected via JavaScript -->
    </div>

  </div>

  <script type="module">
    import { escapeHtml, sanitizeSvg, sanitizeUrl } from './src/utils/escape.js';
    import { CONFIG } from './src/config/config.js';
    import { isAdminAuthenticated, setupAuthSync } from './src/domain/auth.js';
    import { normalizeOrderLines, formatPayment, getPaymentMethod } from './src/domain/orders.js';

    let currentViewMode = 'a4'; // 'a4' | 'a5' | 'label'

    function checkAuth() {
      const isAuth = isAdminAuthenticated();
      const lockOverlay = document.getElementById('admin-lock-screen');
      if (lockOverlay) {
        lockOverlay.classList.toggle('hidden', isAuth);
      }
      return isAuth;
    }

    setupAuthSync(() => {
      checkAuth();
    });

    function updateDynamicPageRule(mode) {
      const styleEl = document.getElementById('dynamic-page-style');
      if (!styleEl) return;
      if (mode === 'a5') {
        styleEl.textContent = '@page { size: A5 portrait; margin: 8mm; }';
      } else if (mode === 'label') {
        styleEl.textContent = '@page { size: 100mm 150mm; margin: 4mm; }';
      } else {
        styleEl.textContent = '@page { size: A4 portrait; margin: 10mm; }';
      }
    }

    export function setSlipViewMode(mode) {
      currentViewMode = mode;
      updateDynamicPageRule(mode);
      document.querySelectorAll('.mode-btn').forEach(btn => {
        const isTarget = btn.dataset.mode === mode;
        btn.classList.toggle('bg-zinc-900', isTarget);
        btn.classList.toggle('text-white', isTarget);
        btn.classList.toggle('bg-zinc-100', !isTarget);
        btn.classList.toggle('text-zinc-700', !isTarget);
      });
      initSlip();
    }

    function formatSizeShort(sizeKey, isBookmark) {
      if (isBookmark) return 'فاصل';
      const map = { small: '6سم', medium: '8سم', large: '10سم', standard: 'فاصل' };
      return map[sizeKey] || sizeKey || '8سم';
    }

    function applySmartCompaction(slipEl, mode, totalUnits) {
      // Printable height budgets at 96dpi (1mm ≈ 3.7795px)
      // A4: 297mm - 20mm margins - 5mm safety = 272mm ≈ 1028px
      // A5: 210mm - 16mm margins - 4mm safety = 190mm ≈ 718px
      const maxHeightPx = mode === 'a5' ? 718 : 1028;
      const levels = ['compact-l1', 'compact-l2', 'compact-l3', 'compact-l4'];

      slipEl.classList.remove(...levels, 'fit-single-page');

      // Apply progressively tighter compaction steps until content fits cleanly without clipping
      for (const lvl of levels) {
        if (slipEl.scrollHeight <= maxHeightPx) break;
        slipEl.classList.add(lvl);
      }

      const warnBox = slipEl.querySelector('.slip-large-warning');
      const fitsOnePage = slipEl.scrollHeight <= maxHeightPx;

      if (mode === 'a5' && (totalUnits > 25 || !fitsOnePage)) {
        if (warnBox) {
          warnBox.textContent = `تنبيه: الطلب كبير جدًا، استخدم A4 (${totalUnits} قطعة) — سيتم استكمال الطباعة بدون قص أي بند.`;
          warnBox.classList.remove('hidden');
        }
        // Allow clean multi-page flow on A5 when >25 items so nothing is ever truncated
        slipEl.classList.remove('fit-single-page');
      } else if (mode === 'a4' && !fitsOnePage) {
        if (warnBox) {
          warnBox.textContent = `تنبيه: الطلب كبير جدًا (${totalUnits} قطعة) — تم الحفاظ على جميع البنود بدون قص.`;
          warnBox.classList.remove('hidden');
        }
        slipEl.classList.remove('fit-single-page');
      } else {
        slipEl.classList.add('fit-single-page');
      }
    }

    function initSlip() {
      checkAuth();
      updateDynamicPageRule(currentViewMode);

      const urlParams = new URLSearchParams(window.location.search);
      const dataParam = urlParams.get('o') || urlParams.get('data');
      const idParam = urlParams.get('id');
      const idsParam = urlParams.get('ids');

      let storedOrders = [];
      try {
        storedOrders = JSON.parse(localStorage.getItem('stickify21_orders') || '[]');
      } catch (e) {}

      let storedProds = [];
      try {
        storedProds = JSON.parse(localStorage.getItem('stickify21_products') || '[]');
      } catch (e) {}
      const prodMap = {};
      storedProds.forEach(p => { prodMap[p.sku] = p; });

      if (idsParam) {
        const idList = idsParam.split(',').map(s => s.trim()).filter(Boolean);
        const matchedOrders = idList.map(id => storedOrders.find(o => o.id === id)).filter(Boolean);
        if (matchedOrders.length > 0) {
          renderOrdersSlips(matchedOrders, prodMap);
          return;
        }
      }

      let order = null;
      if (dataParam) {
        try {
          order = JSON.parse(decodeURIComponent(atob(dataParam)));
        } catch (e) {
          console.error('Error decoding order param', e);
        }
      }

      if (!order && idParam) {
        order = storedOrders.find(o => o.id === idParam);
      }

      if (!order) {
        if (storedOrders.length > 0) {
          order = storedOrders[0];
        } else {
          order = {
            id: 'S21-PREVIEW-01',
            date: new Date().toISOString(),
            customer: {
              name: 'معاينة تجريبية للطلب',
              phone: '01043546503',
              city: 'القاهرة',
              address: 'مدينة نصر - شارع عباس العقاد',
              notes: 'طلب تجريبي لمعاينة شاشة التجهيز'
            },
            payment: { method: 'cod', status: 'pending' },
            total: 125,
            lines: [
              { type: 'single', sku: 'DEV-01', name: 'جيت بوش بالقوة', sizeKey: 'medium', quantity: 2, unitPrice: 35, total: 70 },
              { type: 'bookmark', sku: 'BM-01', name: 'فاصل كتب: خير جليس', sizeKey: 'standard', quantity: 1, unitPrice: 25, total: 25 },
              { type: 'single', sku: 'S21-01', name: 'شعار STICKIFY 21 الرسمي', sizeKey: 'medium', quantity: 1, unitPrice: 30, total: 30 }
            ]
          };
        }
      }

      renderOrdersSlips([order], prodMap);
    }

    function renderOrdersSlips(orders, prodMap) {
      const container = document.getElementById('slips-container');
      if (!container) return;

      if (currentViewMode === 'label') {
        renderShippingLabels(orders, container);
        return;
      }

      const isA5 = currentViewMode === 'a5';

      container.innerHTML = orders.map((order) => {
        const lines = normalizeOrderLines(order);
        let totalUnits = 0;
        lines.forEach(l => {
          if (l.type === 'pack') totalUnits += (l.items?.length || l.size || 5);
          else totalUnits += (l.quantity || 1);
        });

        const rawPhone = (order.customer?.phone || '').replace(/[^0-9]/g, '');
        const paymentLabel = formatPayment(order, 'ar');
        const payMethod = getPaymentMethod(order);
        const codAmount = (payMethod === 'cod' || !(order.paymentVerified || order.payment?.status === 'verified'))
          ? Number(order.total || 0)
          : 0;
        const formattedDate = new Date(order.date || Date.now()).toLocaleDateString('ar-EG');

        const linesHtml = lines.map((line) => {
          if (line.type === 'pack') {
            const subItemsHtml = (line.items || []).map((sub) => {
              const prod = prodMap[sub.sku] || {};
              const safeImg = sanitizeUrl(sub.image || prod.image || (sub.sku === 'S21-01' ? 'logo.jpg' : null));
              const safeSvg = prod.svg ? sanitizeSvg(prod.svg) : '';
              const shortSize = formatSizeShort(sub.sizeKey || sub.size, false);
              const finishLabel = sub.finish === 'glossy' ? 'لامع' : 'مطفي';

              return `
                <div class="slip-pack-subitem">
                  <div class="flex items-center gap-1.5 min-w-0">
                    ${safeImg || safeSvg ? `<div class="slip-thumb">${safeImg ? `<img src="${safeImg}" alt="${escapeHtml(sub.sku || '')}" class="w-full h-full object-contain">` : safeSvg}</div>` : ''}
                    <div class="min-w-0 truncate">
                      <span class="font-mono font-bold text-zinc-900">#${escapeHtml(sub.sku || 'S21')}</span>
                      <span class="sub-name text-zinc-700"> - ${escapeHtml(sub.name || '')}</span>
                      <span class="sub-extra text-zinc-500 font-mono"> (${escapeHtml(shortSize)}/${escapeHtml(finishLabel)})</span>
                    </div>
                  </div>
                  <span class="font-mono text-zinc-600 flex-shrink-0">${escapeHtml(shortSize)}</span>
                </div>
              `;
            }).join('');

            return `
              <div class="slip-pack-group" data-pack-group>
                <div class="flex items-center justify-between font-bold border-b border-orange-200/70 pb-1">
                  <span class="text-[#FF5000]">باقة ${line.size || (line.items?.length || 5)} استيكرات (${Math.round((line.discountRate || 0.2) * 100)}% خصم)</span>
                  <span class="font-mono text-zinc-900">${Number(line.packPrice || 0)} ${CONFIG.CURRENCY}</span>
                </div>
                <div class="slip-pack-subgrid">
                  ${subItemsHtml}
                </div>
              </div>
            `;
          }

          const prod = prodMap[line.sku] || {};
          const isBookmark = line.type === 'bookmark' || (line.sku && String(line.sku).startsWith('BM-'));
          const safeImg = sanitizeUrl(line.image || prod.image || (line.sku === 'S21-01' ? 'logo.jpg' : null));
          const safeSvg = prod.svg ? sanitizeSvg(prod.svg) : '';
          const qty = Number(line.quantity || 1);
          const unitPrice = Number(line.unitPrice || 35);
          const lineTotal = Number(line.total || (unitPrice * qty));
          const shortSize = formatSizeShort(line.sizeKey || line.size, isBookmark);

          return `
            <div class="item-card slip-item-row">
              <div class="flex items-center gap-2 min-w-0">
                ${safeImg || safeSvg ? `<div class="slip-thumb">${safeImg ? `<img src="${safeImg}" alt="${escapeHtml(line.sku || '')}" class="w-full h-full object-contain">` : safeSvg}</div>` : ''}
                <div class="min-w-0 truncate">
                  <span class="font-mono font-bold text-zinc-900">#${escapeHtml(line.sku || 'S21')}</span>
                  <span class="item-name-long font-semibold text-zinc-800"> ${escapeHtml(line.name || 'منتج')}</span>
                  <span class="item-extra text-zinc-500 font-mono"> (${escapeHtml(shortSize)})</span>
                </div>
              </div>
              <div class="font-mono font-bold text-zinc-900 flex-shrink-0">
                <span>${qty}×</span>
                <span class="text-zinc-600">${lineTotal}</span>
              </div>
            </div>
          `;
        }).join('');

        return `
          <div id="packing-slip-card" class="page-slip packing-slip-sheet ${isA5 ? 'page-slip-a5' : ''}" data-total-units="${totalUnits}">
            <!-- Slip Header -->
            <div class="slip-header">
              <div class="flex items-center gap-2.5">
                <img src="logo.jpg" alt="STICKIFY21" class="h-8 w-auto object-contain">
                <div>
                  <h2 class="slip-title font-extrabold text-zinc-900">إذن تجهيز طلبية <span id="order-id" class="font-mono">#${escapeHtml(order.id)}</span></h2>
                  <p class="text-zinc-500 font-mono">STICKIFY 21 PACKING &amp; QC SLIP</p>
                </div>
              </div>
              <div class="text-left font-mono text-zinc-600">
                <div>${escapeHtml(formattedDate)}</div>
                <div class="text-[#FF5000] font-bold font-sans">جاهز للتجميع والتغليف</div>
              </div>
            </div>

            <!-- Customer & Delivery Block -->
            <div class="slip-customer-grid">
              <div class="min-w-0">
                <span class="text-zinc-500 block font-bold">اسم العميل:</span>
                <strong id="customer-name" class="text-zinc-900 block truncate">${escapeHtml(order.customer?.name || '')}</strong>
              </div>
              <div class="min-w-0">
                <span class="text-zinc-500 block font-bold">رقم الهاتف:</span>
                <a id="customer-phone-link" href="https://wa.me/2${rawPhone}" target="_blank" class="font-mono font-bold text-[#FF5000]" dir="ltr">${escapeHtml(order.customer?.phone || '')}</a>
              </div>
              <div class="min-w-0">
                <span class="text-zinc-500 block font-bold">المحافظة والعنوان:</span>
                <span id="customer-address" class="text-zinc-800 block truncate">${escapeHtml(order.customer?.governorate || order.customer?.city || '')} - ${escapeHtml(order.customer?.address || '')}</span>
              </div>
              <div class="min-w-0">
                <span class="text-zinc-500 block font-bold">طريقة الدفع والإجمالي:</span>
                <span id="payment-and-total" class="font-bold text-zinc-900 block truncate">${escapeHtml(paymentLabel)} | <span class="font-mono">${Number(order.total || 0)} ${CONFIG.CURRENCY}</span></span>
              </div>
            </div>

            <!-- Large Order Warning (Dynamic via applySmartCompaction) -->
            <div class="slip-large-warning hidden p-2 bg-amber-50 text-amber-900 rounded-lg border border-amber-300 font-bold mb-2"></div>

            <!-- Items Section (NEVER overflow:hidden) -->
            <div class="space-y-1.5">
              <div class="flex items-center justify-between">
                <h3 class="font-bold text-zinc-900">محتويات الشحنة (${totalUnits} قطعة / ${lines.length} بنود):</h3>
                <span class="text-zinc-500 font-mono">فحص البنود ومطابقتها</span>
              </div>
              <div id="items-grid" class="slip-items-grid">
                ${linesHtml}
              </div>
            </div>

            <!-- Notes if any -->
            ${order.customer?.notes ? `
              <div id="customer-notes" class="slip-notes-box p-2 rounded-lg bg-amber-50/70 border border-amber-200 text-amber-900 mt-2">
                <strong>ملاحظات العميل:</strong> ${escapeHtml(order.customer.notes)}
              </div>
            ` : ''}

            <!-- Totals & Quality Check Line -->
            <div class="slip-footer">
              <div class="text-zinc-600">
                توقيع مسؤول التغليف والجودة: _______________________
              </div>
              <div class="flex items-center gap-3 font-mono">
                <span class="font-sans text-zinc-700 font-bold">${codAmount === 0 ? 'مدفوع إلكترونياً (المطلوب تحصيله):' : 'المطلوب تحصيله (COD):'}</span>
                <span class="slip-total-big font-extrabold text-[#FF5000]">${codAmount} ${CONFIG.CURRENCY}</span>
                <span class="text-zinc-500">(إجمالي: ${Number(order.total || 0)} ${CONFIG.CURRENCY})</span>
              </div>
            </div>
          </div>
        `;
      }).join('');

      // Run measure-and-compact loop on each rendered slip
      container.querySelectorAll('.packing-slip-sheet').forEach(slipEl => {
        const units = Number(slipEl.dataset.totalUnits || 0);
        applySmartCompaction(slipEl, currentViewMode, units);
      });
    }

    function renderShippingLabels(orders, container) {
      container.innerHTML = orders.map(order => {
        const paymentLabel = formatPayment(order, 'ar');
        const payMethod = getPaymentMethod(order);
        const codAmount = (payMethod === 'cod' || !(order.paymentVerified || order.payment?.status === 'verified'))
          ? Number(order.total || 0)
          : 0;

        return `
          <div class="shipping-label-card max-w-sm mx-auto bg-white border-2 border-black rounded-2xl p-4 space-y-2.5 shadow-sm" data-view="label">
            <div class="flex items-center justify-between border-b-2 border-black pb-2">
              <div>
                <h2 class="label-brand font-black tracking-wider text-black font-mono">STICKIFY 21</h2>
                <p class="text-zinc-600">بوليصة شحن وتوصيل سريعة</p>
              </div>
              <div class="text-left font-mono">
                <span class="font-bold block">#${escapeHtml(order.id)}</span>
                <span class="text-zinc-600">${escapeHtml(new Date(order.date || Date.now()).toLocaleDateString('ar-EG'))}</span>
              </div>
            </div>

            <div class="space-y-1 text-black">
              <div class="font-extrabold">المستلم: ${escapeHtml(order.customer?.name || '')}</div>
              <div class="font-mono font-bold text-[#FF5000]" dir="ltr">هاتف: ${escapeHtml(order.customer?.phone || '')}</div>
              <div class="font-bold">المحافظة: ${escapeHtml(order.customer?.governorate || order.customer?.city || '')}</div>
              <div class="text-zinc-800">العنوان: ${escapeHtml(order.customer?.address || '')}</div>
              <div class="text-zinc-700">الدفع: ${escapeHtml(paymentLabel)}</div>
            </div>

            <div class="p-2.5 bg-zinc-100 rounded-xl border border-zinc-300 flex items-center justify-between">
              <span class="font-bold">قيمة التحصيل عند الاستلام:</span>
              <span class="label-cod font-mono font-black text-black">${codAmount} ${CONFIG.CURRENCY}</span>
            </div>

            <div class="pt-2 border-t border-zinc-200 text-center">
              <div class="h-7 bg-zinc-900 mx-auto rounded flex items-center justify-center text-white font-mono tracking-widest">
                ||| | |||| || ||| |||| | |||
              </div>
              <span class="text-zinc-600 font-mono mt-1 block">${escapeHtml(order.id)}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    window.setSlipViewMode = setSlipViewMode;
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', initSlip);
    } else {
      initSlip();
    }
  </script>
</body>
</html>
